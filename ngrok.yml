# Run with: ngrok start --config ~/.ngrok2/ngrok.yml,ngrok.yml --all

version: 3
agent:

endpoints:
  - name: "backend"
    description: "FastAPI backend for MCP Kart"
    url: "https://bruna.ngrok.io"
    upstream:
      url: "http://localhost:8000"

  - name: "mcp"
    description: "FastMCP server for MCP Kart (OAuth callback here)"
    url: "https://tate.ngrok.io"
    upstream:
      url: "http://localhost:8080"

  - name: "frontend"
    description: "SvelteKit spectator UI for MCP Kart"
    url: "https://atbaker.ngrok.io"
    upstream:
      url: "http://localhost:5173"
