[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpkart"
version = "0.1.0"
description = "A realtime kart-driving experiment for decision models over MCP"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.12,<4",
  "httpx>=0.28,<1",
  "pillow>=12,<14",
  "python-dotenv>=1,<2",
  "starlette>=0.40,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
mcpkart-web = "mcpkart.web:main"
mcpkart-bench = "mcpkart.bench:main"

[project.optional-dependencies]
demo = [
    "bedrock-agentcore>=1,<2",
    "boto3[crt]>=1.40,<2",
    "temporalio>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
