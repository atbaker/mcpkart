  <g id="text_41">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182536" x="49.68" y="43.2" transform="rotate(-0 49.68 43.2)">Motion-only facts are promising on one delayed recovery</text>
  </g>
  <g id="text_42">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526277" x="49.68" y="79.2" transform="rotate(-0 49.68 79.2)">28 actual episodes · 8 no-rescue recoveries · 538 valid native replies</text>
  </g>
  <g id="text_43">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182536" x="49.68" y="576" transform="rotate(-0 49.68 576)">Success = five new gate credits before automatic rescue. Two repeats per failure condition; † one normal check/profile.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526277" transform="translate(49.68 610.739094)">All four delayed recoveries had a new kart contact and a first brake reply. Both racers received the assigned profile.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526277" transform="translate(49.68 626.4)">Motion-only scored 2/2 here; the sample does not establish a general advantage or isolate the steering mechanism.</text>
  </g>
  <g id="text_45">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526277" transform="translate(49.68 666.162812)">Physics, race goals and action menus stayed fixed. Only optional wheel facts changed; pedal questions stayed identical.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526277" transform="translate(49.68 680.4)">Native API latency varied. These are selected recovery episodes, not full races. Study 0083 · 24 Oct 2026 (Pacific)</text>
  </g>
