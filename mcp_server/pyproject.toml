[project]
name = "mcpkart-mcp"
version = "0.1.0"
description = "MCP server for MCP Kart racing game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpkart_mcp"]
