[project]
name = "mcpkart-mcp"
version = "0.1.0"
description = "MCP server for MCP Kart racing game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.3",
    "fastmcp>=2.13.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "py-key-value-aio[redis]>=0.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpkart_mcp"]
