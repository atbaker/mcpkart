services:
  # Redis for OAuth token storage and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcpkart
      POSTGRES_USER: mcpkart
      POSTGRES_PASSWORD: mcpkart_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpkart"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal Server (dev mode with built-in UI)
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"  # Temporal server
      - "8233:8233"  # Temporal UI
    volumes:
      - temporal-data:/root/.config/temporalio
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MCP Kart Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=postgresql+psycopg://mcpkart:mcpkart_dev@postgres:5432/mcpkart
      - REDIS_URL=redis://redis:6379
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

  # MCP Kart Temporal Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m mcpkart_backend.temporal.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=postgresql+psycopg://mcpkart:mcpkart_dev@postgres:5432/mcpkart
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

volumes:
  temporal-data:
  backend-data:
  redis-data:
  postgres-data:
