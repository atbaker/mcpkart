services:
  # Temporal Server (dev mode with built-in UI)
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"  # Temporal server
      - "8233:8233"  # Temporal UI
    volumes:
      - temporal-data:/root/.config/temporalio
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MCP Kart Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=sqlite:///./mcpkart.db
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

  # MCP Kart Temporal Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m mcpkart_backend.temporal.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=sqlite:///./mcpkart.db
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - backend-data:/app/data

volumes:
  temporal-data:
  backend-data:
