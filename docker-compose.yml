services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcpkart
      POSTGRES_USER: mcpkart
      POSTGRES_PASSWORD: mcpkart_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpkart"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/root/.config/temporalio
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-init:
    image: temporalio/temporal:latest
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        temporal operator search-attribute create --address temporal:7233 --namespace default --name IsPublic --type Bool || true
        temporal operator search-attribute create --address temporal:7233 --namespace default --name Phase --type Keyword || true
        temporal operator search-attribute create --address temporal:7233 --namespace default --name RacerCount --type Int || true
        echo "Search attributes registered"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      temporal-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run python -m mcpkart_backend.temporal.worker
    env_file: ./backend/.env
    depends_on:
      temporal-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ./mcp_server/.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./mcp_server/src:/app/src:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: ./frontend/.env
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/static:/app/static:ro

volumes:
  temporal-data:
  redis-data:
  postgres-data:
