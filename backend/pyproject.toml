[project]
name = "mcpkart-backend"
version = "0.1.0"
description = "MCP Kart backend - FastAPI + Temporal racing game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.122.0",
    "pydantic>=2.12.4",
    "sqlalchemy>=2.0.44",
    "temporalio>=1.20.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpkart_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
